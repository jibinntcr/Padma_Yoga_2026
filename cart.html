<!DOCTYPE html>
<html lang="en">

<head>
    <title>Your Cart | Padma Here & Now</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta charset="utf-8">

    <link rel="apple-touch-icon" sizes="57x57" href="./assets/images/Padma.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/Padma.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/Padma.png">
    <link rel="manifest" href="./assets/images/favicon/manifest.json">
    <meta name="theme-color" content="#ffffff">

    <link href="assets/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="assets/css/style.css" rel="stylesheet" type="text/css">
    <link href="assets/css/mediaqueries.css" rel="stylesheet" type="text/css">
    <link href="assets/css/custom-style.css" rel="stylesheet" type="text/css">
    <link href="assets/css/special-classes.css" rel="stylesheet" type="text/css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
    <div class="sub-banner-section">
        <header>
            <div class="main_header">
                <div class="container-fluid">
                    <nav class="navbar navbar-expand-lg navbar-light p-0">
                        <a class="navbar-brand" href="./index.html">
                            <figure class="mb-0">
                                <img class="w-200" src="./assets/images/Padma.png" alt="Padma Logo">
                            </figure>
                        </a>
                        <button class="navbar-toggler collapsed" type="button" data-toggle="collapse"
                            data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                            <span class="navbar-toggler-icon"></span>
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <ul class="navbar-nav">
                                <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                                <li class="nav-item"><a class="nav-link" href="./about.html">About Us</a></li>
                                <li class="nav-item"><a class="nav-link" href="./services.html">Services</a></li>
                                <li class="nav-item"><a class="nav-link" href="./contemplation.html">Contemplation</a></li>
                                <li class="nav-item"><a class="nav-link" href="./gallery.html">Gallery</a></li>
                                <li class="nav-item"><a class="nav-link" href="./team.html">Team</a></li>
                                <li class="nav-item"><a class="nav-link" href="./contact.html">Contact Us</a></li>
                                <li class="nav-item active">
                                    <a class="nav-link shop-menu-btn" href="./shop.html">
                                        Our Shop <i class="fa-solid fa-cart-shopping ml-1"></i>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <section class="banner-section">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="banner-section-content">
                            <h1 data-aos="fade-up">Your Cart</h1>
                            <div class="btn_wrapper">
                                <span class="sub_home_span">Shop </span>
                                <i class="fa-solid fa-angles-right"></i>
                                <span class="sub_span"> Cart</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="container py-5">
        <div class="services_content text-center mb-5">
            <h2 style="font-weight:700;">Finalize Your Order</h2>
        </div>

        <div class="table-responsive cart-table-container mb-5">
            <table class="table mb-0">
                <thead class="cart-table-head">
                    <tr>
                        <th style="width: 40%;">Product</th>
                        <th class="text-center">Price</th>
                        <th class="text-center">Quantity</th>
                        <th class="text-center">Total</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="cart-table-body">
                    </tbody>
            </table>
            <div class="p-4 text-right bg-white border-top">
                <h4 style="color:#2d3436; font-weight:700;">
                    Grand Total: <span id="grand-total" style="color:#2389c4;">₹0</span>
                </h4>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card enquiry-card p-4">
                    <div class="card-body">
                        <form id="enquiry-form" onsubmit="sendWhatsAppEnquiry(event)">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="text" id="cust-name" class="form-control" required placeholder="Your Name" style="padding: 12px; border-radius: 8px;">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" id="cust-location" class="form-control" required placeholder="Location (City)" style="padding: 12px; border-radius: 8px;">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label style="font-weight:600; font-size:14px; color:#555;">Preferred Contact Method</label>
                                <select id="cust-contact-method" class="form-control" style="height:45px; border-radius:8px;">
                                    <option value="WhatsApp">WhatsApp</option>
                                    <option value="Email">Email</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-3 btn-whatsapp-form" style="font-weight:600; border-radius:10px;">
                                <i class="fa-brands fa-whatsapp"></i> Confirm & Send via WhatsApp
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <div id="whatsapp-container">
        <div id="toggle-btn">❯</div>
        <a href="https://wa.me/917034199217" target="_blank" class="whatsapp-btn">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>

    <script src="assets/js/jquery-3.6.0.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/animation.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/whatsApp.js"></script>
    <script src="assets/js/shop.js"></script>
</body>
</html>
