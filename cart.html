  <body>
    <div class="sub-banner-section">
      <header>
        <div class="main_header">
          <div class="container-fluid">
            <nav class="navbar navbar-expand-lg navbar-light p-0">
              <a class="navbar-brand" href="./index.html">
                <figure class="mb-0">
                  <img class="w-200" src="./assets/images/Padma.png" alt="" />
                </figure>
              </a>
              <button
                class="navbar-toggler collapsed"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
                <span class="navbar-toggler-icon"></span>
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="./index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./about.html">About Us</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./services.html">Services</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./contemplation.html"
                      >Contemplation</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./gallery.html">Gallery</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./team.html">Team</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./contact.html">Contact Us</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./shop.html">
                      Our Shop
                      <i
                        class="fa-solid fa-cart-shopping ml-1"
                        style="color: #b3dff8; font-size: 0.9em"
                      ></i>
                    </a>
                  </li>
                </ul>
              </div>
            </nav>
          </div>
        </div>
      </header>

      <section class="banner-section">
        <div class="container">
          <div class="row">
            <div class="col-lg-12">
              <div class="banner-section-content">
                <h1 data-aos="fade-up">Your Cart</h1>
                <div class="btn_wrapper">
                  <span class="sub_home_span">Shop </span
                  ><i class="fa-solid fa-angles-right"></i
                  ><span class="sub_span"> Cart</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="container py-5">
      <div class="services_content text-center mb-4">
        <h2>Finalize Enquiry</h2>
      </div>

      <div
        class="table-responsive mb-5"
        style="
          background: #fff;
          padding: 20px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        "
      >
        <table class="table table-bordered">
          <thead style="background-color: #f4f7ff">
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cart-table-body"></tbody>
        </table>
        <div class="text-right p-3">
          <h4 style="color: #2389c4">
            Total Estimate: <span id="grand-total">₹0</span>
          </h4>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm border-0" style="background: #f9f9f9">
            <div class="card-body p-4">
              <form id="enquiry-form" onsubmit="sendWhatsAppEnquiry(event)">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <input
                      type="text"
                      id="cust-name"
                      class="form-control"
                      required
                      placeholder="Your Name"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <input
                      type="text"
                      id="cust-location"
                      class="form-control"
                      required
                      placeholder="Location (City)"
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label>How should we contact you?</label>
                  <select id="cust-contact-method" class="form-control">
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Email">Email</option>
                  </select>
                </div>
                <button
                  type="submit"
                  class="btn btn-success w-100 py-3"
                  style="
                    background-color: #25d366;
                    border: none;
                    font-size: 18px;
                  "
                >
                  <i class="fa-brands fa-whatsapp"></i> Send Enquiry via
                  WhatsApp
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="footer"></div>

    <div id="whatsapp-container">
      <div id="toggle-btn">❯</div>
      <a href="https://wa.me/917034199217" target="_blank" class="whatsapp-btn">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>

    <script src="assets/js/jquery-3.6.0.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/animation.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/whatsApp.js"></script>
    <script src="assets/js/shop.js"></script>
  </body>
</html>
