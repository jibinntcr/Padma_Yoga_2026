    <div class="container py-5">

                <thead class="cart-table-head">
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>

            <div class="text-right p-3">
                <h4 class="cart-total-text">
                    Total Estimate: <span id="grand-total">₹0</span>

        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card enquiry-card">
                    <div class="card-body p-4">
                        <form id="enquiry-form" onsubmit="sendWhatsAppEnquiry(event)">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="text" id="cust-name" class="form-control" required placeholder="Your Name" />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" id="cust-location" class="form-control" required placeholder="Location (City)" />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label>How should we contact you?</label>
                                <select id="cust-contact-method" class="form-control">
                                    <option value="WhatsApp">WhatsApp</option>
                                    <option value="Email">Email</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-3 btn-whatsapp-form">
                                <i class="fa-brands fa-whatsapp"></i> Send Enquiry via WhatsApp
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    <div id="custom-toast">Notification</div>

    <div id="footer"></div>

    <div id="whatsapp-container">
        <div id="toggle-btn">❯</div>
        <a href="https://wa.me/917034199217" target="_blank" class="whatsapp-btn">

    <script src="assets/js/footer.js"></script>
    <script src="assets/js/whatsApp.js"></script>
    <script src="assets/js/shop.js"></script>

<script>
$(document).ready(function() {
    $("#enquiry-form").submit((e) => {
        e.preventDefault();

        // 1. GENERATE ORDER SUMMARY (Scans your cart table)
        var orderList = "";
        $("#cart-table-body tr").each(function() {
            var prod = $(this).find("td:eq(0)").text(); 
            var qty = $(this).find("input").val() || $(this).find("td:eq(2)").text();
            var price = $(this).find("td:eq(3)").text();
            if(prod) {
                orderList += `• ${prod} [Qty: ${qty}] - ${price}\n`;
            }
        });

        // 2. PREPARE DATA
        var formData = {
            form_type: 'order', // <--- This sends it to the "Orders" sheet
            name: $("#cust-name").val(),
            location: $("#cust-location").val(),
            email: $("#cust-email").val(),
            total_amount: $("#grand-total").text(),
            order_details: orderList
        };

        // 3. SEND TO GOOGLE
        var submitButton = $("button[type='submit']");
        var originalText = submitButton.html();
        submitButton.html('Sending...').prop("disabled", true);

        $.ajax({
            // I HAVE PASTED YOUR URL HERE:
            url: "https://script.google.com/macros/s/AKfycbwPPrvp5ZfEIjhqkNC8CUghlTDDdf90F4ricjkUOVJQh-K2MY-JQ0-L4D1vt8GFpF1E/exec",
            
            data: formData,
            method: "POST",
            success: function(response) {
                if (response.result === "success") {
                    alert("Order placed successfully! Check your email.");
                    $("#enquiry-form")[0].reset();
                } else {
                    alert("Error processing order. Please try again.");
                }
                submitButton.html(originalText).prop("disabled", false);
            },
            error: function() {
                alert("Connection failed. Please check your internet.");
                submitButton.html(originalText).prop("disabled", false);
            }
        });
    });
});
</script>
